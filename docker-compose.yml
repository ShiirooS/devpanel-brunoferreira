# Only PostgreSQL is containerized; the API and the web app run on the host (see README).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devpanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpanel}
      POSTGRES_DB: ${POSTGRES_DB:-devpanel}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - devpanel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  devpanel-db-data:
